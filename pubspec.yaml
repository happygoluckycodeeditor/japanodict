name: japanodict
description: "A comprehensive Japanese dictionary app with kanji, vocabulary, and example sentences"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # Database
  sqflite: ^2.4.0
  path: ^1.9.0
  
  # HTTP requests for downloading dictionary data
  http: ^1.2.2
  
  # State management
  provider: ^6.1.2
  
  # UI components
  material_design_icons_flutter: ^7.0.7296
  
  # File operations
  path_provider: ^2.1.4

  # Handwriting (kanji draw-to-search) — on-device ML Kit Digital Ink.
  # PINNED BELOW 0.15.0 ON PURPOSE — do not bump without testing on a device.
  # 0.15.0 rewrote the Android plugin from Java to Kotlin and changed the
  # MethodChannel name to "google_mlkit_digital_ink_recognition" while Dart
  # still opens "google_mlkit_digital_ink_recognizer", so every call fails
  # with MissingPluginException. 0.14.2 has matching names.
  google_mlkit_digital_ink_recognition: ^0.14.0

  # OCR (scan-a-photo lookup) — on-device ML Kit text recognition.
  # Capped at 0.15.x transitively: the pin above holds google_mlkit_commons at
  # 0.11.x, and text recognition 0.16.0 requires commons 0.12.0. Bumping
  # either means testing BOTH plugins on a device, not just `flutter analyze`
  # — the digital-ink breakage described above compiles cleanly.
  google_mlkit_text_recognition: ^0.15.0

  # Camera capture / gallery picking for the OCR screen. Still images only;
  # there is deliberately no live-camera stream.
  image_picker: ^1.2.2
  file_picker: ^11.0.3
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/databases/jitendex.db
    # The app logo, for the places inside the app that show it (drawer header,
    # first-run screen). The launcher icon and the Android launch window do NOT
    # read this — they need real Android resources, which
    # scripts/build_app_icons.py writes into android/app/src/main/res.
    - assets/images/japanodict_logo.png

  # Noto Sans JP is bundled rather than left to the system font, because the
  # system gets it *wrong*. Flutter asks Android for a Han glyph with no
  # language tag attached, and Android's fallback chain answers with Noto Sans
  # CJK **SC** (Simplified Chinese) on any device whose locale isn't Japanese.
  # The characters are the same code points, so nothing looks broken — the
  # shapes are just Chinese (直 骨 今 令 曜 differ visibly). For a Japanese
  # dictionary that is a correctness bug, not a style preference.
  #
  # Declared as a *fallback* in app_theme.dart, not as the app font: Latin UI
  # text keeps the platform default and only CJK falls through to here.
  #
  # The two files are static instances cut from the upstream variable font
  # (`fonttools varLib.instancer wght=400 / wght=700`) — Flutter does not map
  # `fontWeight` onto a variable font's `wght` axis, so shipping the variable
  # file directly would render bold headwords as synthetic smeared bold.
  # Licence: SIL OFL 1.1, see assets/fonts/OFL-NotoSansJP.txt (credited in
  # credits_screen).
  #
  # Inter is the opposite case — it is the app font for Latin text, set as
  # `fontFamily` in app_theme.dart with NotoSansJP behind it as the fallback.
  # It has no kana or kanji at all, and no Japanese punctuation either (、。
  # 「」ー are all absent), so every Japanese character in the app falls
  # through to Noto exactly as before; Inter only ever gets asked for the Latin
  # UI text and the English glosses.
  #
  # Five weights because that is what the app actually asks for: 400 and 500
  # come from Material's own text theme, w600 and bold from the widgets, and
  # italic from the parts-of-speech captions. Every one is a real cut — leaving
  # a weight out means Flutter smears a synthetic one in its place.
  #
  # NOT subsetted, though ~2MB of Latin font looks like an obvious place to
  # save: JMdict glosses are full of Greek (α-helix), Cyrillic, IPA and
  # accented borrowings, and a subset that dropped them would silently swap
  # those characters onto the system font mid-word.
  # Licence: SIL OFL 1.1, see assets/fonts/OFL-Inter.txt (credited in
  # credits_screen).
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
